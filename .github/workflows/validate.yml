name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate catalog without running skill code
        run: python3 scripts/check_catalog.py
      - name: Check generated catalog is current
        run: |
          python3 scripts/build_catalog.py
          git diff --exit-code -- CATALOG.md CATALOG.en.md THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.en.md catalog/categories.json catalog/provenance.json categories/
